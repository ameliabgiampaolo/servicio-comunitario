<p-messages [(value)]="messages" [enableService]="false" class="login-messages"/>
<div class="card">
    <p-toast></p-toast>
    <p-toolbar class="mb-4 gap-2">
        <div class="flex justify-content-start align-items-center w-full">
            <p-dropdown 
            [options]="groupedCourses"  
            [(ngModel)]="selectedCourse" 
            placeholder="Selecciona un curso..." 
            (onChange)="filterSections()" 
            [group]="false">
            <ng-template let-option pTemplate="item">
                <div class="flex align-items-center">
                    <span>{{ option.course }}</span>
                </div>
            </ng-template>

            <ng-template pTemplate="selectedItem" let-selected>
                <span>{{ selected.course }}</span>
            </ng-template>
        </p-dropdown>
            <p-button 
                pRipple 
                severity="success" 
                label="Agregar Sección" 
                icon="pi pi-plus" 
                class="ml-2 mr-2"   
                [disabled]="!selectedCourse"       
                (click)="openNew()" />
                <p-button 
                pRipple 
                severity="danger" 
                label="Retirar" 
                icon="pi pi-trash" 
                (click)="deleteSelectedSection()" 
                [disabled]="!selectedSections || !selectedSections.length" />
        </div>
    </p-toolbar>

    <p-table
        #dt
        [value]="sections"
        [rows]="10"
        [paginator]="selectedCourse"
        [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']"
        [tableStyle]="{ 'min-width': '75rem' }"
        [(selection)]="selectedSections"
        [rowHover]="true"
        dataKey="value"
        currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} entradas"
        [showCurrentPageReport]="true">
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <h5 class="m-0">Gestión de Secciones</h5>
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input 
                        pInputText 
                        type="text" 
                        (input)="dt.filterGlobal($event.target.value, 'contains')" 
                        placeholder="Buscar..." />
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem">
                    <p-tableHeaderCheckbox *ngIf="selectedCourse; else skeleton"/>
                    <ng-template #skeleton>
                        <p-skeleton />
                    </ng-template>
                </th>

                <th></th>

                <th pSortableColumn="name" style="min-width:15rem">
                    Sección <p-sortIcon field="name" />
                </th>

                <th></th>

                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-section>
            <tr>
                <td>
                    <p-tableCheckbox [value]="section" *ngIf="selectedCourse; else skeleton"/>
                    <ng-template #skeleton>
                        <p-skeleton />
                    </ng-template>
                </td>

                <td>
                    <div></div>
                </td>
                
                <td>
                    <div *ngIf="selectedCourse; else skeleton">
                        {{ section.section }}
                    </div>
                    <ng-template #skeleton>
                        <p-skeleton />
                    </ng-template>
                </td>
                <td>
                    <div>
                    </div>
                </td>
                <td>
                    <p-button *ngIf="selectedCourse; else skelebutton"
                        pRipple 
                        icon="pi pi-trash" 
                        severity="danger" 
                        [rounded]="true" 
                        [outlined]="true" 
                        (click)="deleteSection(section)" />
                        <ng-template #skelebutton>
                            <p-skeleton size="3rem" styleClass="mr-3"/>
                        </ng-template>

                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog 
        [(visible)]="sectionDialog" 
        [style]="{ width: 'auto', height: 'auto' }" 
        header="Agrega las secciones"
        [modal]="true" 
        styleClass="p-fluid"
        [contentStyle]="{ 'display': 'flex', 'justify-content': 'center' }">

        <ng-template pTemplate="content">
            <div class="card" style="width: 360px;">
                <p-multiSelect 
                    [options]="sectionsSuggestions" 
                    [(ngModel)]="section.section" 
                    optionLabel="section" 
                    placeholder="Secciones"
                    (onPanelShow)="adjustDialogHeight(true)"
                    (onPanelHide)="adjustDialogHeight(false)" />
            </div>                    
        </ng-template>

        <ng-template pTemplate="footer">
            <p-button 
                pRipple 
                label="Cancelar" 
                icon="pi pi-times" 
                [text]="true" 
                (click)="hideDialog()" />
            <p-button 
                pRipple 
                label="Incluir sección(es)" 
                icon="pi pi-check" 
                [text]="true" 
                (click)="saveSections()" />
        </ng-template>
    </p-dialog>

    <p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>
</div>
