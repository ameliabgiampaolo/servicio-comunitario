<ng-container>
  <c-container [fluid]="true">
    <button
      toggle="visible"
      cHeaderToggler
      [cSidebarToggle]="sidebarId"
      class="ps-1"
    >
      <svg cIcon
        name="cilMenu"
        size="lg"
      ></svg>
    </button>
    <c-header-nav class="d-none d-lg-flex me-auto">
      <c-nav-item>
        <a cNavLink routerLink="/dashboard" routerLinkActive="active">
          Inicio
        </a>
      </c-nav-item>
    </c-header-nav>
    <!-- Coloca el botón de Cerrar Sesión al final (lado derecho) -->
    <c-header-nav class="d-none d-lg-flex ms-auto">
      <c-nav-item>
        <a cNavLink (click)="logout()" routerLinkActive="active">
          <svg cIcon
            name="cilExitToApp"
            size="lg"
          ></svg>
          Cerrar Sesión
        </a>
      </c-nav-item>
    </c-header-nav>
  </c-container>
</ng-container>
